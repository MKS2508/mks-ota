# The Linux half of `src/install/full/` is `#[cfg(target_os = "linux")]`,
# so a macOS-only CI run never compiles it — the exact gap that shipped a
# broken test module undetected (see docs/handoffs/lane-ci-linux-2026-09-02.md).
# Hence the two-platform matrix: each job guards what the other cannot see.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A red Linux job must not cancel macOS (and vice versa) — the whole
      # point of the matrix is comparing both results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Pinned, not floating `stable`: this crate produces installers.
      # 1.98 is the toolchain the Linux suite was verified against
      # (rust:1.98-slim container, 57 passed / 0 failed / 1 ignored).
      - uses: dtolnay/rust-toolchain@1.98

      # Caches ~/.cargo registry + per-job target/ keyed on Cargo.toml hash.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tauri3

      # Tauri 2's GTK/WebKit stack, needed by `--features tauri` on Linux.
      # Tauri 3 (tauri3/) builds without them.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev

      - run: cargo test

      # Tauri 2 build of the Tauri-bound modules (protocol, arm_hot_apply).
      # `!cancelled()`: each build reports on its own even if an earlier
      # step failed.
      - if: ${{ !cancelled() }}
        run: cargo test --features tauri

      # Tauri 3 build of the same source (own workspace, own lockfile).
      - if: ${{ !cancelled() }}
        run: cargo test --manifest-path tauri3/Cargo.toml --features tauri
