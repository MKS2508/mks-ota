[package]
name = "mks-ota"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Updater crate reusable across Tauri apps: hub-agnostic manifest, minisign verification, streaming download, full-package install (macOS)."
repository = "https://github.com/MKS2508/mks-ota"

[dependencies]
minisign-verify = "0.2.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
flate2 = "1.1"
tar = "0.4"
sha2 = "0.11"
tempfile = "3.27"
semver = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
