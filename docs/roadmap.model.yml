    refs: [dec-0001, adr-0045, adr-0046]
    docs: [docs/handoffs/evidence/diseno-ota-parcial-034-2026-09-02.md]
    milestones:
      - id: outcome/ota-crate-verified/minisign-key-rotation-cross-repo-dep
        title: 'NO_ES_BUG_DE_ESTE_CRATE — verify.rs toma el pubkey como parámetro (&str, ''app-specific, baked in by the caller'', comentario en verify.rs:19-21): el crate en sí es agnóstico de clave. El trust anchor bakeado como constante compilada en DOS binarios distintos vive en los REPOS CONSUMIDORES (hub + desktop app), no aquí. La decisión de ''una clave por proyecto o por componente'' la está lockeando waxin en el repo del hub — este nodo solo refleja la dependencia cross-repo, NO la decide.'
        status: queued
        dependsOn: []

    gate:
      items:
        - id: G1
          verdict: open
          class: gate
          # full install (macOS+Linux) instalado y usado por una app real en
          # producción, no solo verificado por tests unitarios

        - id: G2
          verdict: open
          class: gate
          # canal parcial deja de mentir en mod.rs (frontend-only, no
          # "sidecar, assets, hooks/skills") Y soporta al menos un payload
          # no-frontend, o el doc se corrige para decir "solo frontend"

        - id: G3
          verdict: open
          class: gate
          # smoke del ciclo completo (publish -> stage -> activar ->
          # confirmar -> sobrevivir 3 arranques -> rollback provocado)
          # existe y pasa — ver track/partial-channel/no-full-cycle-smoke

        - id: G4
          verdict: open
          class: gate
          # CI verde de verdad: `cargo test` (el comando real del workflow,
          # no solo --lib) pasa en las dos patas de la matriz — ver
          # track/ci-hardening/cargo-test-broken-on-macos

