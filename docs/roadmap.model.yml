    milestones:
      - id: track/ci-hardening/cargo-test-broken-on-macos
        title: 'CODIGO_VIVO, hallazgo propio de este bootstrap - .github/workflows/ci.yml corre ''cargo test'' (no --lib) en ambas patas. VERIFICADO en macOS: ''cargo test'' -> rc=101, E0433 en examples/pkexec_smoke.rs:18 (''could not find linux in full''), porque ese example llama a mks_ota::install::full::linux sin cfg(target_os), modulo que no existe en macOS. El commit que anadio el example (df2a891/7e58d3a) dice explicitamente ''examples/pkexec_smoke.rs queda fuera de cargo test a proposito'' pero no aplico ningun mecanismo real para lograrlo. La verificacion de la lane ci-linux (commit aeb4e6b) contrasto 54 (macOS) vs 57+1 (Linux), que son los numeros de ''cargo test --lib'' - el comando que el guard probo no es el que el workflow ejecuta de verdad. Repo 9 commits por delante de origin/main sin push: este workflow roto aun no ha corrido en GitHub Actions.'
        status: queued
        dependsOn: []

