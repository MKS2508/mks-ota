  - id: track/full-install-linux
    kind: track
    zone: full-install
    title: 'AppImage+deb full install simétrico a macOS (ADR-0046) — bloqueado por swap_app_dirs'
    status: in_progress
    dependsOn: []
    milestones:
      - id: track/full-install-linux/swap-appdirs-bug
        title: 'CODIGO_VIVO - swap_app_dirs (linux.rs:192-212) renombra el directorio extraido entero sobre app_path: el runtime AppImage espera un fichero, recibe un directorio. Test install_swaps_the_bundle_in_place (linux.rs:353-378) sigue #[ignore]d con la justificacion original intacta. El handoff lane-swap-appdirs-2026-09-02.md pedia el fix + quitar el ignore + assert is_file(); VERIFICADO por git log/grep que nunca se aplico - los commits de sib/swap-appdirs son duplicados byte-identicos (mismo mensaje y autor-date, distinto hash por rebase) de los que si mergearon a main via la otra rama, y tratan del path pkexec/deb (THIRD-PARTY.md, examples/pkexec_smoke.rs), no de este bug. df2a891 (dangling, no alcanzable desde ninguna rama) tiene el mismo contenido que 7e58d3a (mergeado): la prueba de que el trabajo del lane nunca ocurrio.'
        status: queued
        dependsOn: []

    gate:
      items:
        - id: U1
          verdict: pass
          class: impl
          evidenceRef: [23939e56c8e3]
          verifiedBy: axon

        - id: U2
          verdict: pass
          class: live-evidence
          evidenceRef: [0a6f05d37e3f, df2a891faef0]
          verifiedBy: axon

  - id: track/partial-channel
    kind: track
    zone: partial-channel
    title: 'A/B slot partial updater extraído de tpv-el-haido2 (ADR-0045 D10-D F2) — con deuda documentada'
    status: in_progress
    dependsOn: []
    milestones:
      - id: track/partial-channel/spa-only-gate
        title: 'CODIGO_VIVO - stage() (apply.rs:88-147, gate en 132-137) aborta con BadArchive si el zip no trae index.html en la raiz, ANTES de crear el slot. Un binario, un directorio de hooks o una skill no pueden nunca pasar el canal parcial hoy.'
        status: queued
        dependsOn: []

      - id: track/partial-channel/no-permissions-on-extract
        title: 'CODIGO_VIVO con control positivo - extract_zip (apply.rs:61-88) escribe con File::create+io::copy, nunca lee entry.unix_mode() ni llama set_permissions: ningun extraido sale ejecutable. Grep del crate entero por set_permissions|PermissionsExt|unix_mode|0o755: 2 hits, AMBOS dentro de mod tests de linux.rs (lineas 323,333 - tar header de un fixture sintetico, no una syscall real). Control positivo confirmado: el patron SI encuentra algo, asi que el cero en apply.rs es real.'
        status: queued
        dependsOn: []

      - id: track/partial-channel/mod-rs-overpromise
        title: 'CODIGO_VIVO - src/install/partial/mod.rs:1-5 (doc-comment del modulo) dice que el canal parcial sirve ''frontend bundle, sidecar, assets, hooks/skills''; el codigo solo admite frontend (bloqueado por spa-only-gate y no-permissions-on-extract). Familia la-exageracion-compila: el doc promete una capacidad que ningun codigo ejecuta.'
        status: queued
        dependsOn: []

      - id: track/partial-channel/bundle-reverted-no-listeners
        title: 'CODIGO_VIVO (emisor) + NO_VERIFICADO (oyentes) - watchdog.rs:39 declara BUNDLE_REVERTED_EVENT (''ota://bundle-reverted''), emitido en watchdog.rs:121 via app.emit(). Cero listeners dentro de este crate (no le corresponde tenerlos, es una lib). El claim de ''cero oyentes en el consumidor'' viene del eje cross-repo del evidence doc (diseno-ota-parcial-034-2026-09-02.md) - NO reverificado por mi en este bootstrap porque el listener, si existe, vive en otro repo (wraith-linux/TPV).'
        status: queued
        dependsOn: []

      - id: track/partial-channel/no-full-cycle-smoke
        title: 'CODIGO_VIVO - tests/partial_pipeline.rs cubre download->verify->stage->activate->rollback->invalidate en 1 test, pero JAMAS llama a watchdog::reconcile_boot; los 6 tests de watchdog.rs (lineas 140-222) nunca llaman a partial::stage/activate_staged. El ciclo publish->confirmar->sobrevivir-3-arranques->rollback-provocado no lo verifica ningun test - cada mitad se prueba por separado y el pegamento no lo mira nadie.'
        status: queued
        dependsOn: []

      - id: track/partial-channel/staged-huerfano-sobrevive-al-cambio-de-nativo
        title: 'CODIGO_VIVO con especimen real - invalidate_if_native_changed (slots.rs:99-126) sale por early-return en :101-103 si active.is_none() y NUNCA toca staged/staged_version. Un update nativo deja el staged intacto, y activate_staged (apply.rs:153) no comprueba contra que nativo se construyo: no existe campo native_version_at_stage. ESPECIMEN: la instalacion viva de waxin tiene ahora mismo state.json = {active:null, previous:5668.., staged:5668.., staged_version:''2026.9.5-4'', native_version_at_swap:null} con el nativo en 0.4.4 - ''wraith-ota activate'' hoy montaria ese frontend sobre 0.4.4. AGRAVANTE: el test slots.rs:248 PINTA EL BUG COMO CORRECTO (''Idempotent: with no active slot there is nothing to invalidate'') - misma familia que el test que fijaba PARTIAL_NATIVE_MAX en el consumidor: la suite verde ES el mecanismo por el que el bug sobrevive.'
        status: done
        completedDate: '2026-09-05'
        dependsOn: []

      - id: track/partial-channel/l6-citado-en-codigo-no-existe-en-ningun-doc
        title: 'MARCADOR_HUERFANO - slots.rs:95 y mod.rs:17 citan ''Contract invariant L6'' como la autoridad de que el canal nativo invalida el parcial. Grep del repo entero por ''L6\b'' en md+yml+rs: 2 hits, LOS DOS son esos comentarios. Control positivo: el patron ''invariant L[0-9]'' encuentra slots.rs:95, o sea el grep funciona - el cero en docs/ es real. docs/adr/ solo tiene adr-0046-linux-full-install.md. El comentario cita un contrato que no existe en este repo (vive, si acaso, en el consumidor). Familia marcadores-sin-ancla: el lector tira del id y no encuentra medicion.'
        status: queued
        dependsOn: []

      - id: track/partial-channel/stage-borra-el-directorio-que-es-previous
        title: 'CODIGO_VIVO, riesgo acotado - stage() (apply.rs:139) hace remove_dir_all(&final_dir) antes del rename, y final_dir es el slot id, que es content-addressed (slot_id(&actual_sha), apply.rs:116). Re-stagear bytes identicos a un slot que sigue siendo ''previous'' borra el destino del rollback y lo repone por rename. Ventana de crash pequena y el contenido que aterriza es identico, por eso NO es P0 - pero el rollback depende de un directorio que otra funcion borra sin mirar el state. Especimen: el state vivo de waxin tiene previous == staged == 5668.., que es exactamente esta colision.'
        status: queued
        dependsOn: []

      - id: track/partial-channel/el-suite-depende-de-un-fixture-remoto-mutable
        title: 'CODIGO_VIVO con medicion - 9 de 54 tests de ''cargo test --lib'' estan ROJOS y no es codigo nuestro: download::tests (4), verify::tests (3) e install::full::macos::tests (2) comparten un fixture que se DESCARGA EN RUNTIME de una URL pineada, y el hub responde 404. Medido: curl a /api/components/wraith-linux/download/0.1.0/darwin/aarch64/Wraith.app.tar.gz -> http=404, size=50; el ''artefacto'' que aterriza en el tmpdir son los 50 bytes del cuerpo del error ({"error":"File not found"}), de ahi el ''invalid gzip header''. NO es bloqueo de red: el curl sale rc=0 y el hub contesta. Ese artefacto simplemente ya no esta publicado (encaja con el DROP TABLE releases del M6 del hub, 28-ago). Control positivo del instrumento: el mismo cargo test --lib filtrado a install::partial da rc=0, o sea el runner sabe dar verde. || POR QUE ES DEUDA Y NO ANECDOTA: un suite que depende de un artefacto remoto MUTABLE se pone rojo cuando alguien de otro repo borra algo, y su rojo no dice nada sobre este codigo. Peor: normaliza el rojo, y un suite cronicamente rojo deja de discriminar — nadie mira los 9 y el dia que sean 10 tampoco. Opciones: fixture local commiteado (bytes en tests/fixtures, que ya es el patron del canal parcial), o el test se salta explicito con motivo cuando el fetch falla, NUNCA un ignore mudo. || Verificado como PREEXISTENTE, no regresion: la lista de nombres de los 9 fallos es identica antes y despues de la lane staged-invalidation (diff de las dos listas, rc=0).'
        status: queued
        dependsOn: []
    gate:
      items:
        - id: U1
          verdict: pass
          class: impl
          evidenceRef: [8df4138aac24]
          verifiedBy: axon

