      - id: outcome/ota-crate-verified/minisign-key-rotation-cross-repo-dep
        title: 'NO_ES_BUG_DE_ESTE_CRATE — verify.rs toma el pubkey como parámetro (&str, ''app-specific, baked in by the caller'', comentario en verify.rs:19-21): el crate en sí es agnóstico de clave. El trust anchor bakeado como constante compilada en DOS binarios distintos vive en los REPOS CONSUMIDORES (hub + desktop app), no aquí. La decisión de ''una clave por proyecto o por componente'' la está lockeando waxin en el repo del hub — este nodo solo refleja la dependencia cross-repo, NO la decide.'
